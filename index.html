<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loomi Spec Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<style>
/* Layout: one full-bleed stage — the pod with its camera and lighting tools floating over it. */
:root{
  --bg:#e7e5e0; --stage:#eeece8; --panel:#f7f6f3; --ink:#23211d; --muted:#76716a; --line:#d9d5ce; --accent:#a8722f; --accent-soft:#a8722f1f;
  --display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--stage:#22211e;--panel:#262522;--ink:#ece8e1;--muted:#9c968c;--line:#3a3833;--accent:#d69b52;--accent-soft:#d69b5226;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a18;--stage:#22211e;--panel:#262522;--ink:#ece8e1;--muted:#9c968c;--line:#3a3833;--accent:#d69b52;--accent-soft:#d69b5226;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.stage{position:relative;background:var(--stage);color:var(--ink);transition:background-color .5s ease,color .5s ease;min-height:0;overflow:hidden}
#viewport{position:absolute;inset:0;touch-action:none}
#viewport canvas{display:block;width:100%;height:100%}
.mast{position:absolute;left:24px;top:22px;right:24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.mast h1{margin:0;font:650 clamp(26px,3vw,40px)/1 var(--display);letter-spacing:-.02em;text-wrap:balance}
.mast p{margin:8px 0 0;color:var(--muted);max-width:34ch}
.code{font:500 11px/1 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.mast .code{padding-top:6px;text-align:right;line-height:1.6}
.tools{position:absolute;left:24px;bottom:22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:calc(100% - 48px)}
.seg,.toggle{transition:background-color .5s ease,border-color .5s ease,color .5s ease;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.seg .code,.toggle .code{padding:0 8px 0 8px;font-size:10px}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.toggle{gap:8px;padding-right:12px;cursor:pointer;font-size:13px}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle i{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px #0003;transition:transform .2s}
.toggle input:checked+i{background:var(--accent)}
.toggle input:checked+i::after{transform:translateX(12px)}
.toggle input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
/* Nighttime darkens the stage itself, whatever the page theme. */
.stage.night .mast{text-shadow:0 1px 10px #000a}
.stage.night{--stage:#141519;--ink:#ece8e1;--muted:#9c968c;--panel:#23242a;--line:#3a3b42;color:var(--ink)}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--stage);z-index:2}
.hint{position:absolute;right:24px;bottom:28px;color:var(--muted);font-size:12px}
@media (max-width:820px){
  .stage{min-height:420px}
    .mast{left:16px;right:16px;top:16px}.mast .code{display:none}
  .tools{left:16px;bottom:16px;max-width:calc(100% - 32px);gap:6px}.hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <section class="stage" aria-label="3D model of the Loomi pod">
    <div id="viewport"><div id="loading">Loading the pod…</div></div>
    <div class="mast">
      <div><h1>Loomi</h1><p>The LUM-9000 pod, finished to the Visualization Guide.</p></div>
      <div class="code">LUM-9000-WIP-260930<br>Guide · 10/02/2026</div>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Camera angle"><span class="code">Camera</span>
        <button data-view="three" aria-pressed="true">3/4</button><button data-view="straight" aria-pressed="false">Straight on</button><button data-view="interior" aria-pressed="false">Interior</button></div>
      <div class="seg" role="group" aria-label="Lighting"><span class="code">Lighting</span>
        <button data-light="day" aria-pressed="true">Daytime</button><button data-light="night" aria-pressed="false">Nighttime</button></div>
      <label class="toggle" for="ambient"><span class="code">Ambient mode</span><input id="ambient" type="checkbox" role="switch" checked><i aria-hidden="true"></i><span id="ambient-state">On</span></label>
    </div>
    <div class="hint">Drag to orbit · scroll to zoom</div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
