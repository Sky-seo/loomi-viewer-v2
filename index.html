<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loomi Spec Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<style>
/* Layout: a white rounded card on a pale sky page holds the pod. Categories sit in a column on the left;
   the chosen category's options appear in a column on the right. */
:root{
  --page:#eef6fb; --stage:#ffffff; --navy:#121a4f; --pill:#eef5fb; --pill-hover:#e2eef8; --muted:#5d6488; --accent:#121a4f;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--navy);font:400 16px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid #7cc0f0;outline-offset:3px}
.app{height:100%;padding:16px}
.stage{position:relative;height:100%;background:var(--stage);border-radius:40px;overflow:hidden;transition:background-color .5s ease}
/* Nighttime darkens the card itself. */
.stage.night{--stage:#10142e}
#viewport{position:absolute;inset:0;touch-action:none}
#viewport canvas{display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--stage);z-index:2;font-weight:600}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.col{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:22px;z-index:1}
.cats{left:7%;align-items:flex-start}
.opts{right:7%;align-items:flex-end}
.pill{padding:14px 30px;border-radius:999px;background:var(--pill);color:var(--navy);font-weight:900;font-size:20px;letter-spacing:.01em;white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,transform .15s ease}
.pill:hover{background:var(--pill-hover)}
.pill:active{transform:scale(.97)}
.pill[aria-pressed="true"],.pill[aria-expanded="true"]{background:var(--navy);color:#fff}
.opts .group{display:flex;flex-direction:column;align-items:flex-end;gap:22px}
.opts .group[hidden]{display:none}
.opts .group{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
/* On the night stage the idle pills go dark so they do not glare. */
.stage.night .pill{background:#232a55;color:#e8ecff}
.stage.night .pill[aria-pressed="true"],.stage.night .pill[aria-expanded="true"]{background:#fff;color:var(--navy)}

@media (max-width:820px){
  .app{padding:10px}
  .stage{border-radius:28px}
  .col{top:auto;bottom:18px;transform:none;gap:10px}
  .cats{left:16px}.opts{right:16px}
  .opts .group{gap:10px}
  .pill{padding:10px 18px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <section class="stage" aria-label="3D model of the Loomi pod">
    <h1 class="sr-only">Loomi pod viewer</h1>
    <div id="viewport"><div id="loading">Loading the pod…</div></div>
    <nav class="col cats" aria-label="Viewer settings">
      <button class="pill" data-cat="camera" aria-expanded="true" aria-controls="opt-camera">Camera</button>
      <button class="pill" data-cat="lighting" aria-expanded="false" aria-controls="opt-lighting">Lighting</button>
      <button class="pill" data-cat="ambient" aria-expanded="false" aria-controls="opt-ambient">Ambient Mode</button>
    </nav>
    <div class="col opts">
      <div class="group" id="opt-camera" role="group" aria-label="Camera angle">
        <button class="pill" data-view="three" aria-pressed="true">3/4</button>
        <button class="pill" data-view="straight" aria-pressed="false">Straight on</button>
        <button class="pill" data-view="interior" aria-pressed="false">Interior</button>
      </div>
      <div class="group" id="opt-lighting" role="group" aria-label="Lighting" hidden>
        <button class="pill" data-light="day" aria-pressed="true">Daytime</button>
        <button class="pill" data-light="night" aria-pressed="false">Nighttime</button>
      </div>
      <div class="group" id="opt-ambient" role="group" aria-label="Ambient mode" hidden>
        <button class="pill" data-ambient="on" aria-pressed="true">On</button>
        <button class="pill" data-ambient="off" aria-pressed="false">Off</button>
      </div>
    </div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
